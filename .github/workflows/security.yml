name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency audit ages out even when nothing is committed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt, validate, checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive task1-terraform-gcp

      - name: Validate module
        working-directory: task1-terraform-gcp/examples
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # --require-hashes rejects any package whose download does not match the
      # locked hash, covering the whole transitive tree. See .github/requirements.in.
      - run: pip install --require-hashes -r .github/requirements.txt
      - name: Checkov
        run: |
          checkov -d task1-terraform-gcp --framework terraform --compact             --output cli --output sarif --output-file-path console,results.sarif

      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
          category: checkov-terraform

  cloudformation:
    name: CloudFormation (cfn-lint, checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # --require-hashes rejects any package whose download does not match the
      # locked hash, covering the whole transitive tree. See .github/requirements.in.
      - run: pip install --require-hashes -r .github/requirements.txt

      # Only the hardened template is expected to pass. vulnerable/ is kept as
      # the "before" evidence and is excluded on purpose.
      - name: cfn-lint
        run: cfn-lint task2-cloud-security-check/hardened/template.yaml

      - name: Checkov
        run: |
          checkov -f task2-cloud-security-check/hardened/template.yaml \
            --framework cloudformation --compact --quiet

  docker:
    name: Dockerfile (hadolint, checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: task2-cloud-security-check/hardened/Dockerfile
          failure-threshold: warning

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # --require-hashes rejects any package whose download does not match the
      # locked hash, covering the whole transitive tree. See .github/requirements.in.
      - run: pip install --require-hashes -r .github/requirements.txt

      - name: Checkov
        run: |
          checkov -f task2-cloud-security-check/hardened/Dockerfile \
            --framework dockerfile --compact --quiet

  go:
    name: Go scanner (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3-go-cloud-scanner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: task3-go-cloud-scanner/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -cover

      - name: Golden fixture scan still matches the schema
        run: go run . -fixture testdata/fixture.json | diff - testdata/expected-report.json

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task4-dependency-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The supplied manifest is knowingly vulnerable and is kept as evidence,
      # so the audit runs against the remediated one -- which must stay clean.
      - name: Audit the remediated manifest
        run: |
          mkdir -p /tmp/fixed && cp package.fixed.json /tmp/fixed/package.json
          cd /tmp/fixed
          npm install --package-lock-only --no-audit --no-fund
          npm audit --audit-level=low

      - name: Regenerate the reports for the supplied manifest
        run: |
          python3 audit_report.py --input reports/npm-audit.json \
            --csv /tmp/vulnerabilities.csv --json /tmp/audit-report.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
